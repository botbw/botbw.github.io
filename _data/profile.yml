short_bio: >-
  <p>
    I am a research assistant in the <a href="https://psl-ntu.github.io/" target="_blank">Parallel Systems Lab</a>
    at Nanyang Technological University (NTU), Singapore, advised by
    <a href="https://wangchen.io/" target="_blank">Prof. Chen Wang</a>. Currently, I work on accelerating attention
    through sparsity and KV-cache compression, and on resource management and allocation for agentic systems.
    More broadly, I am interested in <strong>machine learning systems</strong> and <strong>efficient machine learning</strong>:
    building systems for emerging workloads such as diffusion models and agentic workflows, and designing algorithms
    like mixture-of-experts that run efficiently on real hardware.
  </p>
  <p>
    Before that, during my undergraduate studies, I was fortunate to assist in
    <a href="https://www.comp.nus.edu.sg/~youy/" target="_blank">Prof. Yang You</a>'s HPC-AI Lab at the National
    University of Singapore. Working with <a href="https://shenggan.github.io/" target="_blank">Dr. Shenggan Cheng</a> at the lab and <a href="https://orcid.org/0009-0000-6193-6126" target="_blank">Dr. Lansong Diao</a> from Alibaba Cloud PAI Research, I first learned about machine learning
    systems, distributed training, and machine learning compilers. I then joined Prof. You's startup, first as an
    intern and later as an engineer, where I worked with <a href="https://github.com/ver217" target="_blank">Mr. Hongxin Liu</a>
    and <a href="https://scholar.google.com/citations?user=c-ks50cAAAAJ" target="_blank">Dr. Hang Xu</a> and gained hands-on experience across the AI infrastructure stack, from GPU performance and distributed training to storage and cluster management. Along the way,
    I have also learned a great deal from excellent community projects.
  </p>

